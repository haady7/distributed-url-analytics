[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-url-analytics"
version = "1.0.0"
description = "A production-minded URL shortener with JWT auth, Redis token-bucket rate limiting, and asynchronous click analytics."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "PyMySQL>=1.1,<2.0",
  "cryptography>=42,<47",
  "pydantic-settings>=2.5,<3.0",
  "email-validator>=2.2,<3.0",
  "python-jose[cryptography]>=3.3,<4.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "redis>=5.0,<7.0",
  "celery>=5.4,<6.0",
  "geoip2>=4.8,<6.0",
  "boto3>=1.35,<2.0",
  "alembic>=1.13,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
  "locust>=2.31,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.setuptools.packages.find]
include = ["app*"]
