name: Expand LinkPulse source

on:
  push:
    paths:
      - ".github/workflows/expand-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild project source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/linkpulse
          cat \
            .staging/linkpulse-source-00.b64 \
            .staging/linkpulse-source-01.b64 \
            .staging/linkpulse-source-02.b64 \
            .staging/linkpulse-source-03-fixed.b64 \
            .staging/linkpulse-source-04.b64 \
            .staging/linkpulse-source-05.b64 \
            | base64 --decode > /tmp/linkpulse/source.tar.xz
          xz -t /tmp/linkpulse/source.tar.xz
          tar -xJf /tmp/linkpulse/source.tar.xz -C /tmp/linkpulse
          cp -a /tmp/linkpulse/distributed-url-analytics/. .
          rm -rf /tmp/linkpulse .staging
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add LinkPulse application, tests, and deployment files"
            git push
          fi

# Re-run after fixing the staged source payload.
